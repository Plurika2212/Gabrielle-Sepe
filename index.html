<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Bit About Me - Profile & Portfolio</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- External CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    
    <!-- Top Header Section -->
    <header class="header-section">
      <span class="sub-heading">A BIT ABOUT ME</span>
      <h1 class="main-heading">Who Am I?</h1>
      <p class="bio-text">
        Hi, I'm Gabrielle Ardin J. Sepe. I am a 4th Year BS-Nursing Student from MSU-IIT
      </p>
    </header>

  
    <div class="profile-grid">
      
  
      <section class="blue-card">
        <div class="avatar-container">
          <img src="shao.jpg" alt="Jack Smith Profile Picture">
        </div>
        <h2 class="card-headline">
          I am happy to tell you that I will Be Graduating Soon!
        </h2>
        <a href="#learn-more" class="btn-outline">LEARN MORE</a>
      </section>


      <div class="services-grid">

        <article class="service-card border-orange">
          <div class="card-content">
            <div class="icon-box color-orange">
              <i class="fa-solid fa-palette"></i>
            </div>
            <h3 class="service-title">PAPER FLOWER</h3>
            <a href="#more" class="more-link">MORE</a>
          </div>
        </article>

        <article class="service-card border-cyan">
          <div class="card-content">
            <div class="icon-box color-cyan">
              <i class="fa-solid fa-desktop"></i>
            </div>
            <h3 class="service-title">WEB DESIGN</h3>
            <a href="#more" class="more-link">MORE</a>
          </div>
        </article>


        <article class="service-card border-blue">
          <div class="card-content">
            <div class="icon-box color-blue">
              <i class="fa-solid fa-code"></i>
            </div>
            <h3 class="service-title">COOKING</h3>
            <a href="#more" class="more-link">MORE</a>
          </div>
        </article>

        <article class="service-card border-yellow">
          <div class="card-content">
            <div class="icon-box color-yellow">
              <i class="fa-solid fa-window-maximize"></i>
            </div>
            <h3 class="service-title">APPLICATION</h3>
            <a href="#more" class="more-link">MORE</a>
          </div>
        </article>

      </div>

    </div>

  </main>

</body>
</html>
